<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAULT — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #09100e;
  --surface: #111a16;
  --surface2:#172018;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text:    #edf5f0;
  --muted:   #5a7066;
  --green:   #00d68f;
  --green-d: rgba(0,214,143,0.1);
  --red:     #ff5c5c;
  --red-d:   rgba(255,92,92,0.1);
  --r:       12px;
  --r-lg:    20px;
}

body {
  font-family: 'Lexend', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.page {
  max-width: 980px;
  margin: 0 auto;
  padding: 2rem 1.5rem 5rem;
}

/* ── HEADER ───────────────────────────────────── */
.header {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 2.5rem;
}
.logo {
  font-family: 'Syne', sans-serif;
  font-size: 22px; font-weight: 800;
  letter-spacing: 3px; color: var(--green);
}
.header-date {
  font-size: 13px; color: var(--muted); font-weight: 400;
}

/* ── BALANCE HERO ─────────────────────────────── */
.balance-hero {
  background: linear-gradient(135deg, #0d2e1e 0%, #0a1f16 100%);
  border: 1px solid rgba(0,214,143,0.15);
  border-radius: var(--r-lg);
  padding: 2rem 2.5rem;
  margin-bottom: 1.5rem;
  display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: 1.5rem;
}
.balance-label {
  font-size: 12px; font-weight: 500;
  color: var(--muted); letter-spacing: 0.15em;
  text-transform: uppercase; margin-bottom: 0.4rem;
}
.balance-amount {
  font-family: 'Syne', sans-serif;
  font-size: clamp(36px, 7vw, 58px);
  font-weight: 800; line-height: 1;
  color: var(--green);
  transition: color 0.3s;
}
.balance-amount.negative { color: var(--red); }

.summary-cards {
  display: flex; gap: 1rem; flex-wrap: wrap;
}
.s-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  padding: 0.9rem 1.25rem; min-width: 130px;
}
.s-card-label {
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
  font-weight: 500; margin-bottom: 0.3rem;
}
.s-card-val {
  font-family: 'Syne', sans-serif;
  font-size: 20px; font-weight: 700;
}
.s-card-val.inc { color: var(--green); }
.s-card-val.exp { color: var(--red); }

/* ── LAYOUT ───────────────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 1.5rem;
  align-items: start;
}
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; }
}

/* ── ADD FORM ─────────────────────────────────── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 1.5rem;
}
.panel-title {
  font-family: 'Syne', sans-serif;
  font-size: 16px; font-weight: 700;
  margin-bottom: 1.25rem;
  display: flex; align-items: center; gap: 0.5rem;
}

.type-toggle {
  display: flex; gap: 0.5rem; margin-bottom: 1.25rem;
}
.type-btn {
  flex: 1; padding: 0.6rem;
  border-radius: var(--r); border: 1px solid var(--border2);
  background: var(--surface2); color: var(--muted);
  cursor: pointer; font-family: 'Lexend', sans-serif;
  font-size: 13px; font-weight: 500;
  transition: all 0.2s;
}
.type-btn.active-inc {
  background: var(--green-d);
  border-color: rgba(0,214,143,0.35);
  color: var(--green);
}
.type-btn.active-exp {
  background: var(--red-d);
  border-color: rgba(255,92,92,0.35);
  color: var(--red);
}

.form-group { margin-bottom: 1rem; }
.form-label {
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
  font-weight: 500; display: block; margin-bottom: 0.4rem;
}
.form-input, .form-select {
  width: 100%;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--r); padding: 0.7rem 0.9rem;
  color: var(--text); font-family: 'Lexend', sans-serif;
  font-size: 14px; outline: none;
  transition: border-color 0.2s;
  appearance: none;
}
.form-input:focus, .form-select:focus { border-color: var(--green); }
.form-input::placeholder { color: var(--muted); }
.form-select option { background: #1a2e22; }

.add-btn {
  width: 100%; padding: 0.85rem;
  background: var(--green); color: #000;
  border: none; border-radius: var(--r);
  font-family: 'Lexend', sans-serif; font-weight: 600;
  font-size: 15px; cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  margin-top: 0.25rem;
}
.add-btn:hover { opacity: 0.88; }
.add-btn:active { transform: scale(0.99); }

/* ── RIGHT COLUMN ─────────────────────────────── */
.right-col { display: flex; flex-direction: column; gap: 1.5rem; }

/* chart */
.chart-wrap { position: relative; padding: 1.25rem; }
.chart-inner { max-width: 220px; margin: 0 auto; }
.chart-empty {
  text-align: center; padding: 2rem 1rem;
  color: var(--muted); font-size: 13px;
}

/* ── TRANSACTION LIST ─────────────────────────── */
.list-header {
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 1rem;
}
.clear-all {
  font-size: 12px; color: var(--muted);
  background: none; border: none; cursor: pointer;
  font-family: 'Lexend', sans-serif;
  transition: color 0.2s; padding: 0;
}
.clear-all:hover { color: var(--red); }

.tx-list { display: flex; flex-direction: column; gap: 0.6rem; }

.tx-item {
  display: flex; align-items: center;
  gap: 0.75rem; padding: 0.9rem 1rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  animation: fadeUp 0.3s ease;
  transition: border-color 0.2s;
}
.tx-item:hover { border-color: var(--border2); }

.tx-icon {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.tx-icon.inc { background: var(--green-d); }
.tx-icon.exp { background: var(--red-d); }

.tx-info { flex: 1; min-width: 0; }
.tx-desc {
  font-size: 14px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tx-cat {
  font-size: 11px; color: var(--muted); margin-top: 1px;
  text-transform: capitalize;
}
.tx-date { font-size: 11px; color: var(--muted); }

.tx-right { text-align: right; flex-shrink: 0; }
.tx-amount {
  font-family: 'Syne', sans-serif;
  font-size: 15px; font-weight: 700;
}
.tx-amount.inc { color: var(--green); }
.tx-amount.exp { color: var(--red); }

.tx-del {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 16px; padding: 0 0 0 0.5rem;
  transition: color 0.2s; line-height: 1;
}
.tx-del:hover { color: var(--red); }

.tx-empty {
  text-align: center; padding: 3rem 1rem;
  color: var(--muted); font-size: 14px;
}
.tx-empty .empty-icon { font-size: 40px; margin-bottom: 0.75rem; opacity: 0.4; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">VAULT</div>
    <div class="header-date" id="headerDate"></div>
  </div>

  <!-- BALANCE HERO -->
  <div class="balance-hero">
    <div>
      <div class="balance-label">Total Balance</div>
      <div class="balance-amount" id="balanceAmt">R 0.00</div>
    </div>
    <div class="summary-cards">
      <div class="s-card">
        <div class="s-card-label">Income</div>
        <div class="s-card-val inc" id="totalInc">R 0.00</div>
      </div>
      <div class="s-card">
        <div class="s-card-label">Expenses</div>
        <div class="s-card-val exp" id="totalExp">R 0.00</div>
      </div>
    </div>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="layout">

    <!-- LEFT: TRANSACTIONS LIST -->
    <div>
      <div class="panel">
        <div class="list-header">
          <div class="panel-title">Transactions</div>
          <button class="clear-all" onclick="clearAll()">Clear all</button>
        </div>
        <div class="tx-list" id="txList">
          <div class="tx-empty">
            <div class="empty-icon">💳</div>
            No transactions yet — add one to get started
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="right-col">

      <!-- ADD FORM -->
      <div class="panel">
        <div class="panel-title">Add Transaction</div>

        <div class="type-toggle">
          <button class="type-btn active-inc" id="btnInc" onclick="setType('income')">＋ Income</button>
          <button class="type-btn" id="btnExp" onclick="setType('expense')">－ Expense</button>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <input class="form-input" id="desc" type="text" placeholder="e.g. Salary, Uber Eats...">
        </div>

        <div class="form-group">
          <label class="form-label">Amount (R)</label>
          <input class="form-input" id="amount" type="number" min="0" step="0.01" placeholder="0.00">
        </div>

        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-select" id="category">
            <option value="General">General</option>
          </select>
        </div>

        <button class="add-btn" onclick="addTransaction()">Add Transaction</button>
      </div>

      <!-- CHART -->
      <div class="panel chart-wrap">
        <div class="panel-title">Spending Breakdown</div>
        <div id="chartArea">
          <div class="chart-empty">No expenses to display yet</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  /* ── DATA ────────────────────────────────── */
  let transactions = JSON.parse(localStorage.getItem('vault_tx') || '[]');
  let currentType  = 'income';
  let chart        = null;

  const categories = {
    income:  ['General','Salary','Freelance','Investment','Gift','Other'],
    expense: ['General','Food','Transport','Shopping','Bills','Health','Entertainment','Subscriptions','Other']
  };

  /* ── INIT ────────────────────────────────── */
  document.getElementById('headerDate').textContent =
    new Date().toLocaleDateString('en', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  setType('income');
  renderAll();

  /* ── TYPE TOGGLE ─────────────────────────── */
  function setType(type) {
    currentType = type;
    document.getElementById('btnInc').className =
      'type-btn' + (type === 'income' ? ' active-inc' : '');
    document.getElementById('btnExp').className =
      'type-btn' + (type === 'expense' ? ' active-exp' : '');

    const sel = document.getElementById('category');
    sel.innerHTML = categories[type].map(c => `<option value="${c}">${c}</option>`).join('');
  }

  /* ── ADD ─────────────────────────────────── */
  function addTransaction() {
    const desc   = document.getElementById('desc').value.trim();
    const amount = parseFloat(document.getElementById('amount').value);
    const cat    = document.getElementById('category').value;

    if (!desc)        { flash('desc',   'Please add a description'); return; }
    if (!amount || amount <= 0) { flash('amount', 'Please enter a valid amount'); return; }

    const tx = {
      id:     Date.now(),
      type:   currentType,
      desc,
      amount,
      category: cat,
      date:   new Date().toLocaleDateString('en', { day:'numeric', month:'short', year:'numeric' })
    };

    transactions.unshift(tx);
    save();
    renderAll();

    document.getElementById('desc').value   = '';
    document.getElementById('amount').value = '';
  }

  function flash(id, msg) {
    const el = document.getElementById(id);
    el.style.borderColor = 'var(--red)';
    el.placeholder = msg;
    setTimeout(() => {
      el.style.borderColor = '';
      el.placeholder = id === 'desc' ? 'e.g. Salary, Uber Eats...' : '0.00';
    }, 2000);
  }

  /* ── DELETE ──────────────────────────────── */
  function deleteTransaction(id) {
    transactions = transactions.filter(t => t.id !== id);
    save();
    renderAll();
  }

  function clearAll() {
    if (!transactions.length) return;
    if (confirm('Delete all transactions?')) {
      transactions = [];
      save();
      renderAll();
    }
  }

  /* ── SAVE ────────────────────────────────── */
  function save() {
    localStorage.setItem('vault_tx', JSON.stringify(transactions));
  }

  /* ── RENDER ALL ──────────────────────────── */
  function renderAll() {
    renderSummary();
    renderList();
    renderChart();
  }

  /* ── SUMMARY ─────────────────────────────── */
  function renderSummary() {
    const inc = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const exp = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const bal = inc - exp;

    const fmt = n => `R ${n.toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

    const balEl = document.getElementById('balanceAmt');
    balEl.textContent = fmt(Math.abs(bal));
    balEl.className   = 'balance-amount' + (bal < 0 ? ' negative' : '');
    if (bal < 0) balEl.textContent = '−' + fmt(Math.abs(bal));

    document.getElementById('totalInc').textContent = fmt(inc);
    document.getElementById('totalExp').textContent = fmt(exp);
  }

  /* ── LIST ────────────────────────────────── */
  const icons = {
    Salary:'💼', Freelance:'💻', Investment:'📈', Gift:'🎁',
    Food:'🍔', Transport:'🚗', Shopping:'🛍️', Bills:'⚡',
    Health:'💊', Entertainment:'🎮', Subscriptions:'📱',
    General:'💰', Other:'📦'
  };

  function renderList() {
    const list = document.getElementById('txList');
    if (!transactions.length) {
      list.innerHTML = `<div class="tx-empty"><div class="empty-icon">💳</div>No transactions yet — add one to get started</div>`;
      return;
    }
    list.innerHTML = transactions.map(t => `
      <div class="tx-item">
        <div class="tx-icon ${t.type === 'income' ? 'inc' : 'exp'}">
          ${icons[t.category] || '💰'}
        </div>
        <div class="tx-info">
          <div class="tx-desc">${escHtml(t.desc)}</div>
          <div class="tx-cat">${t.category}</div>
        </div>
        <div class="tx-right">
          <div class="tx-amount ${t.type === 'income' ? 'inc' : 'exp'}">
            ${t.type === 'income' ? '+' : '−'}R ${t.amount.toLocaleString('en', {minimumFractionDigits:2})}
          </div>
          <div class="tx-date">${t.date}</div>
        </div>
        <button class="tx-del" onclick="deleteTransaction(${t.id})" title="Delete">×</button>
      </div>`).join('');
  }

  /* ── CHART ───────────────────────────────── */
  function renderChart() {
    const expenses = transactions.filter(t => t.type === 'expense');
    const area     = document.getElementById('chartArea');

    if (!expenses.length) {
      if (chart) { chart.destroy(); chart = null; }
      area.innerHTML = `<div class="chart-empty">No expenses to display yet</div>`;
      return;
    }

    // Group by category
    const catTotals = {};
    expenses.forEach(t => {
      catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
    });

    const labels = Object.keys(catTotals);
    const data   = Object.values(catTotals);
    const colors = ['#00d68f','#ff5c5c','#ffa94d','#74c0fc','#da77f2','#63e6be','#ff8787','#a9e34b','#4dabf7'];

    if (!area.querySelector('canvas')) {
      area.innerHTML = '<div class="chart-inner"><canvas id="donut"></canvas></div>';
    }

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById('donut'), {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{ data, backgroundColor: colors.slice(0, labels.length), borderWidth: 0, hoverOffset: 6 }]
      },
      options: {
        cutout: '68%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              color: '#5a7066',
              font: { family: 'Lexend', size: 11 },
              padding: 12, boxWidth: 10, boxHeight: 10
            }
          },
          tooltip: {
            callbacks: {
              label: ctx => ` R ${ctx.raw.toLocaleString('en', { minimumFractionDigits: 2 })}`
            }
          }
        }
      }
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
